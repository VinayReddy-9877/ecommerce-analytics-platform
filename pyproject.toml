[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "olist-analytics"
version = "2.2.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "SQLAlchemy>=2,<3", "psycopg[binary]>=3.2,<4", "dbt-postgres>=1.9,<2", "scipy>=1.14,<2", "statsmodels>=0.14,<1", "plotly>=5.24,<7", "streamlit>=1.40,<2", "requests>=2.32,<3", "python-dotenv>=1,<2", "openpyxl>=3.1,<4", "tabulate>=0.9,<1"]
[project.optional-dependencies]
ai = ["openai>=1.60,<3"]
dev = ["pytest>=8,<10", "ruff==0.17.3", "sqlfluff==3.4.0"]
reports = ["reportlab", "matplotlib"]
[project.scripts]
olist = "olist.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
