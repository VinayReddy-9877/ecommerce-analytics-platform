version: 2
models:
- name: stg_orders
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
    description: Order identifier. Unique in the order fact; repeated on child item/payment tables.
  - name: order_status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - delivered
          - shipped
          - canceled
          - unavailable
          - invoiced
          - processing
          - created
          - approved
    description: Final source-snapshot status; not status reconstructed as of the purchase date.
  - name: customer_id
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
    description: Order-specific customer identifier; use customer_unique_id for repeat purchases.
  - name: purchased_at
    description: Timestamp when the order was purchased.
  - name: approved_at
    description: Payment approval timestamp.
  - name: carrier_at
    description: Order-level timestamp of handoff to carrier; not a separate timestamp for every seller.
  - name: delivered_at
    description: Actual customer-delivery timestamp, nullable even for some delivered statuses.
  - name: estimated_at
    description: Promised delivery date represented as a timestamp.
  description: Historical Olist stg orders. See docs/metric_contract.md for inclusion and date rules.
- name: stg_customers
  columns:
  - name: customer_id
    data_tests:
    - unique
    - not_null
    description: Order-specific customer identifier; use customer_unique_id for repeat purchases.
  - name: customer_unique_id
    description: Stable observed buyer identifier used for cohorts and repeat purchases.
  - name: zip_prefix
    description: Zip prefix; defined by this model SQL and its documented grain.
  - name: city
    description: City; defined by this model SQL and its documented grain.
  - name: state
    description: State; defined by this model SQL and its documented grain.
  description: Historical Olist stg customers. See docs/metric_contract.md for inclusion and date rules.
- name: stg_products
  columns:
  - name: product_id
    data_tests:
    - unique
    - not_null
    description: Product id; defined by this model SQL and its documented grain.
  - name: category
    description: Product category; missing values use the documented unknown category in business marts.
  - name: weight_g
    description: Weight g; defined by this model SQL and its documented grain.
  description: Historical Olist stg products. See docs/metric_contract.md for inclusion and date rules.
- name: stg_sellers
  columns:
  - name: seller_id
    data_tests:
    - unique
    - not_null
    description: Seller id; defined by this model SQL and its documented grain.
  - name: zip_prefix
    description: Zip prefix; defined by this model SQL and its documented grain.
  - name: city
    description: City; defined by this model SQL and its documented grain.
  - name: state
    description: State; defined by this model SQL and its documented grain.
  description: Historical Olist stg sellers. See docs/metric_contract.md for inclusion and date rules.
- name: stg_geolocation
  columns:
