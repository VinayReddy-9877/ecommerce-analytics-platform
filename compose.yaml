services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: ${PGPASSWORD:-olist_local}
    ports: ["127.0.0.1:${PGPORT:-5433}:5432"]
    volumes: ["warehouse:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist"]
      interval: 5s
      retries: 12
volumes:
  warehouse:
